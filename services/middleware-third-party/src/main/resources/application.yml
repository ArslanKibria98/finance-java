server:
  port: ${SERVER_PORT:8093}
  shutdown: graceful

spring:
  application:
    name: middleware-third-party
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:middleware_third_party_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:islamic-financing}
          jwk-set-uri: ${KEYCLOAK_BASE_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:islamic-financing}/protocol/openid-connect/certs

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

app:
  environment: ${APP_ENVIRONMENT:DEV}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://65.108.31.172:7374}
  middleware:
    # System default client used by the internal /api/v1/execute/{apiCode}/simple endpoint.
    # Caller services (lending-service, onboarding-workflow-service, etc.) do not pass
    # X-Secret-Key — the middleware resolves this client by code and uses its env
    # (TEST -> mock + client_request_test, DEV -> live + client_request_dev, etc.).
    default-client-code: ${MIDDLEWARE_DEFAULT_CLIENT_CODE:TEST_MOCK_CLIENT}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing.middleware: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:WARN}
    org.hibernate.SQL: ${HIBERNATE_LOG_LEVEL:WARN}

ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
  blacklist:
    enabled: ${BLACKLIST_GUARD_ENABLED:true}
    cache-key-prefix: blacklist
    fail-open: false
    token-only: true