spring:
  application:
    name: customer-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.ksa.financing.*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/islamic-financing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/islamic-financing/protocol/openid-connect/certs}
temporal:
  server:
    host: ${TEMPORAL_HOST:localhost}
    port: ${TEMPORAL_PORT:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  worker:
    max-concurrent-activities: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:100}
    max-concurrent-workflows: ${TEMPORAL_MAX_CONCURRENT_WORKFLOWS:50}

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.customer.adapter.rest.controller

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://65.108.31.172:7374}
  tenant:
    header-name: X-Tenant-ID
    default: default

wallet:
  service:
    url: ${WALLET_SERVICE_URL:http://wallet-service:8088}

risk:
  service:
    url: ${RISK_SERVICE_URL:http://risk-service:8090}

lending:
  service:
    url: ${LENDING_SERVICE_URL:http://lending-service:8097}

kyc:
  service:
    url: ${KYC_SERVICE_URL:http://kyc-adapter-service:8087}

onboarding:
  service:
    url: ${ONBOARDING_SERVICE_URL:http://onboarding-workflow-service:8089}

pii:
  vault:
    url: ${PII_VAULT_URL:http://pii-vault-service:8086}
    mock: ${PII_VAULT_MOCK:false}

ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
    skip-patterns:
      - /internal/**
