spring:
  application:
    name: risk-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:risk_service}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/islamic-financing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/islamic-financing/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.risk.adapter.rest.controller

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://65.108.31.172:7374}
  services:
    fraud-service-url: ${FRAUD_SERVICE_URL:http://localhost:8092}
    middleware-url: ${MIDDLEWARE_SERVICE_URL:http://localhost:8093}
    middleware-secret-key: ${MIDDLEWARE_SECRET_KEY:}
  risk:
    velocity:
      ip-max-per-hour: 10
      device-max-per-day: 5
      nid-max-per-day: 3
      mobile-max-per-day: 3
      global-spike-multiplier: 2.0
    scoring:
      watchlist-weight: 40
      velocity-anomaly-weight: 25
      new-everything-weight: 15
      multi-nid-device-weight: 30
      thresholds:
        low-max: 30
        medium-max: 60
        high-max: 80
    credit-scoring:
      min-pass-percentage: ${CREDIT_SCORING_MIN_PASS_PCT:60}

ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
