spring:
  application:
    name: ledger-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ksa.financing.*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/CompanyRealm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/CompanyRealm/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.ledger.adapter.rest.controller

# Casbin authorization
ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies

# Fineract integration
  fineract:
    base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
    office-id: ${FINERACT_OFFICE_ID:1}
    tenant-id: ${FINERACT_TENANT_ID:default}
    username: ${FINERACT_USERNAME:mifos}
    password: ${FINERACT_PASSWORD:password}

# Kafka topic names (no hardcoding)
kafka:
  topics:
    entry-posted: ${KAFKA_TOPIC_LEDGER_ENTRY_POSTED:financing.ledger.entry.posted}
    entry-synced: ${KAFKA_TOPIC_LEDGER_ENTRY_SYNCED:financing.ledger.entry.synced}
    recon-discrepancy: ${KAFKA_TOPIC_RECONCILIATION_DISCREPANCY:financing.reconciliation.discrepancy}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      fineract-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      fineract-api:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
