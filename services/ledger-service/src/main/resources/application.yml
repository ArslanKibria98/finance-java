spring:
  application:
    name: ledger-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.LinkedHashMap
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/CompanyRealm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/CompanyRealm/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8095}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.ledger.adapter.rest.controller

# Casbin authorization
ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies

  blacklist:
    enabled: ${BLACKLIST_GUARD_ENABLED:true}
    cache-key-prefix: blacklist
    fail-open: false
    token-only: true
ledger:
  admin-adjustment:
    # Opposite leg for POST /api/v1/ledger/admin-movements (must exist in COA per tenant). Override in prod via env.
    offset-account-code: ${LEDGER_ADMIN_ADJUSTMENT_OFFSET_ACCOUNT_CODE:3000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:4200,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:4200,http://127.0.0.1:5173,http://127.0.0.1:5174,http://46.62.226.94:7374,http://65.108.31.172:7374,https://46.62.226.94:7374,https://65.108.31.172:7374}

  # Used when lending-service calls POST /internal/v1/journal-entries without X-Created-By
  internal-journal:
    default-created-by-user-id: ${INTERNAL_JOURNAL_DEFAULT_CREATED_BY_UUID:}

  services:
    collections-service-url: ${COLLECTIONS_SERVICE_URL:http://collections-service:8099}
    lending-service-url: ${LENDING_SERVICE_URL:http://lending-service:8097}

# Fineract integration (ledger-service is the SINGLE bridge to Fineract)
  fineract:
    base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
    office-id: ${FINERACT_OFFICE_ID:1}
    tenant-id: ${FINERACT_TENANT_ID:default}
    username: ${FINERACT_USERNAME:mifos}
    password: ${FINERACT_PASSWORD:password}
    default-savings-product-id: ${FINERACT_SAVINGS_PRODUCT_ID:1}
    idempotency-ttl-hours: ${FINERACT_PROXY_IDEMPOTENCY_TTL_HOURS:24}

# Kafka topic names (no hardcoding)
kafka:
  topics:
    entry-posted: ${KAFKA_TOPIC_LEDGER_ENTRY_POSTED:financing.ledger.entry.posted}
    entry-synced: ${KAFKA_TOPIC_LEDGER_ENTRY_SYNCED:financing.ledger.entry.synced}
    recon-discrepancy: ${KAFKA_TOPIC_RECONCILIATION_DISCREPANCY:financing.reconciliation.discrepancy}
    # Inbound topics consumed for auto-journalization
    loan-disbursed: ${KAFKA_TOPIC_LOAN_DISBURSED:financing.loan.loan-disbursed}
    payment-completed: ${KAFKA_TOPIC_PAYMENT_COMPLETED:financing.payment.completed}
    settlement-confirmed: ${KAFKA_TOPIC_SETTLEMENT_CONFIRMED:financing.settlement.confirmed}
    loan-overdue: ${KAFKA_TOPIC_LOAN_OVERDUE:financing.loan.overdue}

# Resilience4j
resilience4j:
  circuitbreaker:
    instances:
      fineract-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      fineract-api:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
