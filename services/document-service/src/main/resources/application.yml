server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:document_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_BASE_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:CompanyRealm}
          jwk-set-uri: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080}/realms/${KEYCLOAK_REALM:CompanyRealm}/protocol/openid-connect/certs

minio:
  enabled: true
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:ksa-financing-documents}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9100}

document:
  master-key: ${DOCUMENT_MASTER_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

ksa:
  authorization:
    enabled: false
  blacklist:
    enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing.document: ${APP_LOG_LEVEL:DEBUG}
