# Development Profile Configuration
spring:
  profiles: dev

  # Development database
  datasource:
    url: jdbc:postgresql://localhost:5432/service_template_dev
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update  # Auto-update schema in dev
    show-sql: true

  # Development Kafka
  kafka:
    bootstrap-servers: localhost:9092

  # Development security (more lenient)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/islamic-financing

# Development server
server:
  port: 8081

# Enhanced logging for development
logging:
  level:
    root: INFO
    com.ksa.financing: DEBUG
    org.springframework: DEBUG
    org.hibernate: DEBUG
    org.apache.kafka: DEBUG
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

# Swagger enabled in dev
springdoc:
  swagger-ui:
    enabled: true
    try-it-out-enabled: true

# Development Temporal
temporal:
  service-address: localhost:7233
  namespace: default

# Development-specific features
app:
  development:
    mock-external-services: true
    detailed-error-messages: true
    sql-logging: true