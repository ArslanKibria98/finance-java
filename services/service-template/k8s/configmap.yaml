apiVersion: v1
kind: ConfigMap
metadata:
  name: service-template-config
  namespace: islamic-financing
  labels:
    app: service-template
data:
  # Database configuration
  db.host: "postgres.islamic-financing.svc.cluster.local"
  db.port: "5432"
  db.name: "service_template"

  # Kafka configuration
  kafka.bootstrap.servers: "kafka-broker-0.kafka.svc.cluster.local:9092,kafka-broker-1.kafka.svc.cluster.local:9092,kafka-broker-2.kafka.svc.cluster.local:9092"

  # Keycloak configuration
  keycloak.issuer.uri: "https://keycloak.islamic-financing.svc.cluster.local/realms/islamic-financing"
  keycloak.jwk.set.uri: "https://keycloak.islamic-financing.svc.cluster.local/realms/islamic-financing/protocol/openid-connect/certs"

  # Temporal configuration
  temporal.address: "temporal-frontend.temporal.svc.cluster.local:7233"
  temporal.namespace: "islamic-financing"

  # CORS configuration
  cors.allowed.origins: "https://app.islamic-financing.sa,https://admin.islamic-financing.sa"

  # Application configuration
  app.environment: "production"
  app.region: "ksa"