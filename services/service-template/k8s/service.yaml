apiVersion: v1
kind: Service
metadata:
  name: service-template
  namespace: islamic-financing
  labels:
    app: service-template
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app: service-template
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-template
  namespace: islamic-financing
  labels:
    app: service-template