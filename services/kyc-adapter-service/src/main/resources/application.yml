spring:
  application:
    name: kyc-adapter-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kyc_adapter_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/islamic-financing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/islamic-financing/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8087}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.kycadapter.adapter.rest.controller

temporal:
  server:
    host: ${TEMPORAL_HOST:localhost}
    port: ${TEMPORAL_PORT:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  worker:
    max-concurrent-activities: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:100}
    max-concurrent-workflows: ${TEMPORAL_MAX_CONCURRENT_WORKFLOWS:50}

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  tenant:
    header-name: X-Tenant-ID
    default: default
  kyc:
    government-api:
      base-url: ${GOV_API_BASE_URL:https://api.absher.sa}
      timeout-ms: ${GOV_API_TIMEOUT:30000}
      retry-max-attempts: ${GOV_API_RETRY_ATTEMPTS:3}
    verification-queue: ${KYC_VERIFICATION_QUEUE:financing.kyc.verification}

ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
