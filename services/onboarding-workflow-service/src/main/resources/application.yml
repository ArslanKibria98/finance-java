spring:
  application:
    name: onboarding-workflow-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      # KYC document / selfie images uploaded by the mobile app (multipart file).
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:15MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        connecttimeout: ${MAIL_CONNECT_TIMEOUT_MS:5000}
        timeout: ${MAIL_TIMEOUT_MS:5000}
        writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding_db?stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/islamic-financing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/islamic-financing/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    config-url: ../v3/api-docs/swagger-config
    url: ../v3/api-docs
    tags-sorter: alpha
    doc-expansion: list
  packages-to-scan: com.ksa.financing.onboarding.adapter.rest.controller,com.ksa.financing.onboarding.canada.adapter.rest.controller,com.ksa.financing.onboarding.guest.adapter.rest.controller,com.ksa.financing.onboarding.foreign.adapter.rest.controller

temporal:
  server:
    host: ${TEMPORAL_HOST:localhost}
    port: ${TEMPORAL_PORT:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  worker:
    max-concurrent-activities: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:100}
    max-concurrent-workflows: ${TEMPORAL_MAX_CONCURRENT_WORKFLOWS:50}

app:
  default-tenant-id: ${DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
  services:
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8084}
    risk-service-url: ${RISK_SERVICE_URL:http://localhost:8090}
    kyc-adapter-url: ${KYC_ADAPTER_URL:http://localhost:8087}
    identity-url: ${IDENTITY_SERVICE_URL:http://localhost:8083}
    wallet-service-url: ${WALLET_SERVICE_URL:http://localhost:8088}
    pii-vault-url: ${PII_VAULT_URL:http://localhost:8086}
    global-profile-url: ${GLOBAL_PROFILE_URL:http://localhost:8085}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://document-service:8094}
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://65.108.31.172:7374}

facia:
  # Phase 2C: Facia calls route through middleware-third-party. Credentials are
  # owned by middleware (api_environment_configs.headers). These remain here for
  # reference + mock mode.
  base-url: ${FACIA_BASE_URL:https://api.facia.ai}
  client-id: ${FACIA_CLIENT_ID:415585bd38}
  client-secret: ${FACIA_CLIENT_SECRET:PBi1AeyudzSnDgNQWhnAkWVJrtLj7nohWNturfEC}
  mock: ${FACIA_MOCK:true}

middleware:
  base-url: ${MIDDLEWARE_THIRD_PARTY_URL:http://middleware-third-party:8093}
  client-secret: ${MIDDLEWARE_CLIENT_SECRET:ob-svc-mw-secret-2026-x9k4p}

sullis:
  # Foreign-national KYC. Sullis calls route through middleware-third-party
  # (Sullis-Api-Key owned by the middleware panel: provider SULLIS env config).
  # mock=true bypasses the middleware + Sullis sandbox with canned responses —
  # keep true until the Sullis sandbox (192.168.6.51:8084) is reachable from this
  # environment, then set SULLIS_MOCK=false to route live through the middleware.
  mock: ${SULLIS_MOCK:true}
  webhook-url: ${SULLIS_WEBHOOK_URL:https://onboarding.kfs.com/webhooks/kyc}

twilio:
  # SMS routes through middleware-third-party — Account SID + Auth Token live in the
  # Third Party Management panel (provider TWILIO), NOT here. Onboarding only holds the
  # non-secret From (sender) number + the middleware API code.
  enabled: ${TWILIO_ENABLED:false}
  from-number: ${TWILIO_FROM_NUMBER:}
  api-code: ${TWILIO_API_CODE:TWILIO_SEND_SMS}
  # Test mode: /sms/send-otp returns the OTP in the response (no real SMS, no Twilio
  # number needed). DEV/testing only — never true in prod.
  test-mode: ${TWILIO_TEST_MODE:false}

otp:
  email:
    enabled: ${OTP_EMAIL_ENABLED:true}
    from: ${OTP_EMAIL_FROM:${MAIL_USERNAME:}}
    from-name: ${OTP_EMAIL_FROM_NAME:Sullis Onboarding}
    subject: ${OTP_EMAIL_SUBJECT:Your verification code}
    length: ${OTP_EMAIL_LENGTH:6}
    ttl-seconds: ${OTP_EMAIL_TTL_SECONDS:300}

canada:
  onboarding:
    task-queue: ${CANADA_ONBOARDING_TASK_QUEUE:canada-onboarding-queue}

guest:
  onboarding:
    task-queue: ${GUEST_ONBOARDING_TASK_QUEUE:guest-onboarding-queue}

foreign:
  onboarding:
    task-queue: ${FOREIGN_ONBOARDING_TASK_QUEUE:foreign-onboarding-queue}

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:CompanyRealm}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-dashboard}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:admin-dashboard-secret}
  default-customer-role: ${KEYCLOAK_DEFAULT_CUSTOMER_ROLE:customer}

ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
  blacklist:
    enabled: ${BLACKLIST_GUARD_ENABLED:true}
    cache-key-prefix: blacklist
    fail-open: false
    token-only: true