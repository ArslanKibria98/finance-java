spring:
  application:
    name: wallet-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wallet_db}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ksa.financing.*
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.Map
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/islamic-financing}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/islamic-financing/protocol/openid-connect/certs}

temporal:
  server:
    host: ${TEMPORAL_HOST:localhost}
    port: ${TEMPORAL_PORT:7233}
  namespace: ${TEMPORAL_NAMESPACE:default}
  worker:
    max-concurrent-activities: ${TEMPORAL_MAX_CONCURRENT_ACTIVITIES:100}
    max-concurrent-workflows: ${TEMPORAL_MAX_CONCURRENT_WORKFLOWS:50}

server:
  port: ${SERVER_PORT:8092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.ksa.financing: ${APP_LOG_LEVEL:DEBUG}
    org.apache.kafka: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.ksa.financing.wallet.adapter.rest.controller

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://65.108.31.172:7374}
  tenant:
    header-name: X-Tenant-ID
    default: default
  services:
    customer-service-url: ${CUSTOMER_SERVICE_URL:http://localhost:8084}
  kafka:
    topics:
      customer-created: ${KAFKA_TOPIC_CUSTOMER_CREATED:financing.customer.created}
      wallet-created: ${KAFKA_TOPIC_WALLET_CREATED:financing.wallet.created}
      wallet-transaction: ${KAFKA_TOPIC_WALLET_TRANSACTION:financing.wallet.transacted}
      withdrawal-initiated:   ${KAFKA_TOPIC_WITHDRAWAL_INITIATED:financing.wallet.withdrawal.initiated}
      withdrawal-completed:   ${KAFKA_TOPIC_WITHDRAWAL_COMPLETED:financing.wallet.withdrawal.completed}
      withdrawal-failed:      ${KAFKA_TOPIC_WITHDRAWAL_FAILED:financing.wallet.withdrawal.failed}
      withdrawal-compensated: ${KAFKA_TOPIC_WITHDRAWAL_COMPENSATED:financing.wallet.withdrawal.compensated}

# Wallet-service no longer talks to Fineract directly.
# All Fineract operations are routed through ledger-service /internal/fineract-proxy/savings/**
ksa:
  authorization:
    enabled: true
    cache-key-prefix: casbin:policies
    skip-patterns:
      - /internal/**
  ledger:
    client:
      base-url: ${LEDGER_SERVICE_URL:http://ledger-service:8095}
      caller-service: wallet-service
      use-authenticated-endpoints: ${LEDGER_PROXY_USE_AUTH:false}
      connect-timeout-ms: ${LEDGER_PROXY_CONNECT_TIMEOUT:5000}
      read-timeout-ms: ${LEDGER_PROXY_READ_TIMEOUT:30000}
  wallet:
    fineract:
      office-id: ${FINERACT_OFFICE_ID:1}
      savings-product-id: ${FINERACT_SAVINGS_PRODUCT_ID:1}
      default-tenant-id: ${DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    bank-rails:
      mock: ${BANK_RAILS_MOCK:true}
      reject-above: ${BANK_RAILS_REJECT_ABOVE:50000}
    # Virtual account number + Scotia RTP external fund transfers
    scotia:
      fi-number: ${SCOTIA_FI_NUMBER:002}
      transit: ${SCOTIA_TRANSIT:80150}
      corporate-account: ${SCOTIA_CORPORATE_ACCOUNT:002-80150-0000000}
      corporate-name: ${SCOTIA_CORPORATE_NAME:KSA Islamic Financing Corp}
      default-currency: ${SCOTIA_DEFAULT_CURRENCY:CAD}
      rtp:
        middleware-url: ${MIDDLEWARE_THIRD_PARTY_URL:http://middleware-third-party:8093}
        options-api-code: ${SCOTIA_RTP_OPTIONS_API_CODE:SCOTIABANK_PAYMENT_OPTIONS_INQUIRY}
        commit-api-code: ${SCOTIA_RTP_COMMIT_API_CODE:SCOTIABANK_PAYMENT_COMMIT}
        options-inquiry-enabled: ${SCOTIA_RTP_OPTIONS_INQUIRY_ENABLED:true}
    # GL account codes for external-transfer journal postings (ledger-service)
    gl:
      accounts:
        consumer-wallet: ${WALLET_GL_CONSUMER_WALLET:110401}
        rtp-clearing: ${WALLET_GL_RTP_CLEARING:120601}
        ibft-clearing: ${WALLET_GL_IBFT_CLEARING:120602}
    # IBFT (Scotia EFT) — HOLD-based inter-bank transfers + cron reconciliation
    ibft:
      middleware-url: ${MIDDLEWARE_THIRD_PARTY_URL:http://middleware-third-party:8093}
      payment-secret: ${SCOTIA_PAYMENT_SECRET:payment-service-dev-secret-2026}
      validate-beneficiary-on-add: ${IBFT_VALIDATE_BENEFICIARY:true}
      recon:
        cron: ${IBFT_RECON_CRON:0 */2 * * * *}
        batch-size: ${IBFT_RECON_BATCH:100}
  blacklist:
    enabled: ${BLACKLIST_GUARD_ENABLED:true}
    cache-key-prefix: blacklist
    fail-open: false
    token-only: true