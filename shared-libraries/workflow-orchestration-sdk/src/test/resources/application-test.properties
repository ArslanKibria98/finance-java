# Temporal Configuration for Testing
temporal.server.host=localhost
temporal.server.port=7233
temporal.namespace=test-namespace
temporal.connection.timeout=10
temporal.rpc.timeout=30
temporal.enable.ssl=false

# Worker Configuration
temporal.worker.max-concurrent-activities=50
temporal.worker.max-concurrent-workflows=25
temporal.worker.max-activities-per-second=100
temporal.worker.max-task-queue-activities-per-second=200

# Logging
logging.level.com.ksa.islamic.orchestration=DEBUG
logging.level.io.temporal=INFO