# Foundational Infrastructure SDK Configuration Template

spring:
  application:
    name: ${SERVICE_NAME:ksa-financing-service}

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# Keycloak Configuration
keycloak:
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:islamic-financing}
  resource: ${SERVICE_NAME:ksa-financing-service}
  bearer-only: true

# OpenTelemetry Configuration
opentelemetry:
  jaeger:
    endpoint: ${JAEGER_ENDPOINT:http://localhost:14250}

# Resilience4j Configuration (per docs/standards/RESILIENCE_STANDARDS.md)
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      internal-rest:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
      keycloak:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        slidingWindowSize: 10
      government-api:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 120s
        slidingWindowSize: 5
        slowCallDurationThreshold: 10s
        slowCallRateThreshold: 80

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
    instances:
      internal-rest:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.ksa.financing.infra.exception.BusinessException
          - com.ksa.financing.infra.exception.NotFoundException
      keycloak:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
        ignoreExceptions:
          - com.ksa.financing.infra.exception.BusinessException
      government-api:
        maxAttempts: 3
        waitDuration: 2000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        maxWaitDuration: 30s
        retryExceptions:
          - java.io.IOException
          - java.net.ConnectException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignoreExceptions:
          - com.ksa.financing.infra.exception.BusinessException

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0
    instances:
      internal-rest:
        maxConcurrentCalls: 25
        maxWaitDuration: 0
      keycloak:
        maxConcurrentCalls: 25
        maxWaitDuration: 0
      government-api:
        maxConcurrentCalls: 5
        maxWaitDuration: 1000

# Logging Configuration
logging:
  level:
    com.ksa.financing: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
