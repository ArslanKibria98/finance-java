          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
  /onboarding-service/api/v1/onboarding/submit-edd:
    post:
      summary: '[onboarding-service] 6b. Submit EDD Form (PEP path)'
      tags:
      - Onboarding Flow (onboarding-service)
      operationId: onboarding_service__6b__Submit_EDD_Form__PEP_path
      description: "Kong -> onboarding-workflow-service:8089\nJWT REQUIRED — Step 6b: Submit EDD (Enhanced Due Diligence)\
        \ form\nOnly required when PEP screening detects a politically exposed person (>= 60% confidence)\nUse NID ending\
        \ 888 to trigger PEP path for testing\n\nRequired fields:\n  - politicalPosition: Head of State | Minister | Parliamentarian\
        \ | Senior Military | Judge | Central Bank Governor | Ambassador | Board of State Enterprise | Senior Political Party\
        \ Official | Other\n  - governmentBody: min 3, max 200 chars\n  - countryOfInfluence: ISO 3166 code (SA, AE, etc.)\n\
        \  - positionStartDate: DD/MM/YYYY (cannot be future)\n  - positionEndDate: DD/MM/YYYY or null (current)\n  - primarySourceOfWealth:\
        \ Salary | Business Ownership | Inheritance | Investments | Real Estate | Other\n  - estimatedNetWorth: < 1M | 1M-5M\
        \ | 5M-10M | 10M-50M | > 50M SAR\n  - sourceOfWealthDescription: min 50 chars\n  - sourceOfFunds: Salary | Business\
        \ Profits | Asset Sale | Inheritance | Savings | Other\n  - sourceOfFundsDetails: min 30 chars\n  - relatedPersons:\
        \ optional array [{name, relationship, position}]\n\nDevice metadata via headers"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nationalId:
                  type: string
                  example: '1234567888'
                politicalPosition:
                  type: string
                  example: Minister
                governmentBody:
                  type: string
                  example: Ministry of Finance, Kingdom of Saudi Arabia
                countryOfInfluence:
                  type: string
                  example: SA
                positionStartDate:
                  type: string
                  example: 01/03/2018
                positionEndDate:
