openapi: 3.0.3
info:
  title: KSA Islamic Financing Platform API
  description: 'Unified API documentation for the KSA Islamic Financing Platform.


    All requests go through Kong API Gateway.

    URL pattern: /service-name/api/v1/...'
  version: 1.0.0
  contact:
    name: KSA Financing Platform Team
servers:
- url: http://46.62.226.94:8000
  description: Kong API Gateway
tags:
- name: Auth (identity-service via Kong)
  description: "Kong -> identity-service:8083\nURL: {{kongUrl}}/identity-service/api/v1/auth/...\n\nAuthentication via Identity\
    \ Service through Kong API Gateway.\nLogin endpoints are public (no JWT required).\nTokens auto-set after successful login.\n\
    \nAvailable roles:\n  super_admin - Full system access\n  admin       - Ad"
- name: Onboarding Flow (onboarding-service)
  description: "Kong -> onboarding-workflow-service:8089\nURL: {{kongUrl}}/onboarding-service/api/v1/onboarding/...\n\nComplete\
    \ customer onboarding workflow.\n\nPublic endpoints (no JWT, only need nationalId + mobileNumber):\n  - Initiate, Verify\
    \ OTP, Resend OTP, Nafath Callback\nProtected endpoints (JWT from Verify OTP):"
- name: KYC Adapter (kyc-adapter-service)
  description: 'Kong -> kyc-adapter-service:8087

    URL: {{kongUrl}}/kyc-adapter-service/api/v1/kyc/...


    KYC Adapter OTP and verification endpoints.

    These are the underlying KYC endpoints that the onboarding workflow calls internally.'
- name: Identity Service (identity-service)
  description: 'Kong -> identity-service:8083

    URL: {{kongUrl}}/identity-service/api/v1/auth/...


    Identity Service authentication and authorization endpoints.'
- name: Customer Service (customer-service)
  description: 'Kong -> customer-service:8084

    URL: {{kongUrl}}/customer-service/api/v1/customers/...


    Customer CIF, lifecycle stage, employment, KYC status, and bank account endpoints.


    LifecycleStage: LEAD -> PROSPECT -> QUALIFIED -> APPLICANT -> ACTIVE -> DORMANT -> CHURNED | BLOCKED

    KycStatus: PENDING -> IN_PROG'
- name: Global Profile Service (global-profile-service)
  description: 'Kong -> global-profile-service:8085

    URL: {{kongUrl}}/global-profile-service/api/v1/profiles/...


    Global UID, regional profiles, customer 360 view.

    Zero-PII store — only hashes (nationalIdHash, emailHash, mobileHash). PII lives in PII Vault.


    GlobalKycAggregateStatus: NONE -> PARTIAL -> VERIFIED -> E'
- name: Wallet Service (wallet-service)
  description: 'Kong -> wallet-service:8088

    URL: {{kongUrl}}/wallet-service/api/v1/wallets/...


    Digital wallet creation and management.'
- name: 7b - PII Vault Service (pii-vault-service)
  description: 'Kong -> pii-vault-service:8086

    URL: {{kongUrl}}/pii-vault-service/api/v1/pii/...


    Encrypted PII storage with field-level access control.

    All PII is encrypted using AES-256-GCM at rest.

    Access requires a PII access token from Global Profile Service.

    GDPR right-to-erasure supported via DELETE endpoint'
- name: LEAD Stage
  description: 'LEAD: Customer identified at onboarding start.

    Triggered when NID + mobile are submitted.

    Temporal workflow created, OTP sent.'
- name: PROSPECT Stage
  description: 'PROSPECT: KYC verification in progress.

    Triggered when Nafath identity verification is initiated.

    Customer is now a prospect being verified.'
- name: QUALIFIED Stage
  description: 'QUALIFIED: KYC verified (Yakeen + Sanctions passed).

    Triggered when Nafath callback is received with accepted=true.

    Workflow auto-runs Yakeen identity + Sanctions screening.

    If both pass -> QUALIFIED.'
- name: Risk Assessment (parallel)
  description: 'Risk assessment runs in parallel with the onboarding flow.

    10 internal checks determine if customer can proceed or gets BLOCKED.


    If HARD_BLOCK -> lifecycle transitions to BLOCKED.

    If PASS -> lifecycle continues normally.

    If SOFT_BLOCK -> manual review required.'
- name: Post-Onboarding Verification
  description: 'After onboarding completes, verify the customer''s state across all services.

    Use these to confirm lifecycle stage, KYC status, global profile, and wallet.'
- name: Source of Wealth
  description: 'CRUD operations for Source of Wealth dropdown options.

    Used in EDD form: Primary Source of Wealth field.'
- name: Source of Funds
  description: 'CRUD operations for Source of Funds dropdown options.

    Used in EDD form: Source of Funds for this account field.'
- name: Net Worth Ranges
  description: 'CRUD operations for Net Worth Range dropdown options.

    Used in EDD form: Estimated Net Worth field.

    Each range has min_value and max_value (in SAR).'
- name: Categories
  description: 'Product category reference data.

    Master categories: Murabaha, Ijarah, Tawarruq, BNPL, Crowd Funding.

    Sub-categories are nested under each master category.'
- name: Products (CRUD)
  description: 'Product lifecycle management.

    Create → Update Basic Info → Configure Settings → Add Partners → Add Documents → Activate.'
- name: Settings (Step 3 — 8 Tabs)
  description: 'Product settings configuration.

    All 8 tabs of the product wizard step 3.

    Each tab saves independently via PUT.'
- name: Partners (Step 4)
  description: 'Partner affiliations for the product.

    Partners are standalone entities (in partners table).

    This links partners to products with commission rates.'
- name: Documents (Step 5)
  description: 'Required documents for product application.

    Templates, Guides, Agreements that customers must provide.'
- name: Health & Docs
  description: Health checks and API documentation endpoints.
paths:
  /identity-service/api/v1/auth/login:
    post:
      summary: '[identity-service] Login (Admin)'
      tags:
      - Auth (identity-service via Kong)
      operationId: identity_service__Login__Admin
      description: 'Kong -> identity-service:8083

        PUBLIC — Admin login. Role in token: admin

        Auto-sets accessToken and refreshToken variables.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: Admin@123456
              required:
              - username
              - password
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity — business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /identity-service/api/v1/auth/refresh:
    post:
      summary: '[identity-service] Refresh Token'
      tags:
      - Auth (identity-service via Kong)
      operationId: identity_service__Refresh_Token
      description: 'Kong -> identity-service:8083

        PUBLIC — Refresh expired access token using refresh token.

        Auto-sets new accessToken and refreshToken variables.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  example: '{{refreshToken}}'
              required:
              - refreshToken
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity — business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
  /identity-service/api/v1/auth/login-with-pin:
    post:
      summary: '[identity-service] Customer Login with PIN'
      description: Authenticates a customer using their 10-digit Saudi National ID and 6-digit PIN set during onboarding.
        Returns JWT tokens.
      tags:
      - Auth (identity-service via Kong)
      operationId: loginWithPin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nationalId
              - pin
              properties:
                nationalId:
                  type: string
                  description: Saudi National ID (10 digits, starts with 1 or 2)
                  example: '1234567890'
                  pattern: ^[12]\d{9}$
                  minLength: 10
                  maxLength: 10
                pin:
                  type: string
                  description: 6-digit app PIN set during onboarding
                  example: '123456'
                  pattern: ^\d{6}$
                  minLength: 6
                  maxLength: 6
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        accessToken:
                          type: string
                          description: JWT access token
                        refreshToken:
                          type: string
                          description: Refresh token
                        expiresIn:
                          type: integer
                          description: Token expiry in seconds
                          example: 300
                        tokenType:
                          type: string
                          example: Bearer
        '400':
          description: Invalid NID or PIN format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found for the given National ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid PIN or PIN not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /onboarding-service/api/v1/onboarding/initiate:
    post:
      summary: '[LEAD] 1. Initiate Onboarding -> LEAD'
      tags:
      - LEAD Stage
      operationId: LEAD__1__Initiate_Onboarding____LEAD
      description: 'PUBLIC — NID + mobile -> Temporal workflow starts -> OTP sent.

        lifecycleStage = LEAD

        Internal: Tahakuk mobile ownership check runs automatically.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nationalId:
                  type: string
                  example: '1234567890'
                mobileNumber:
                  type: string
                  example: '+966501234567'
              required:
