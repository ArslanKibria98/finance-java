      security: []
  /onboarding-service/api/v1/onboarding/verify-otp:
    post:
      summary: '[LEAD] 2. Verify OTP (still LEAD)'
      tags:
      - LEAD Stage
      operationId: LEAD__2__Verify_OTP__still_LEAD
      description: 'PUBLIC — OTP verified -> Keycloak user created -> JWT tokens returned.

        lifecycleStage = LEAD (still, stage doesn''t change until Nafath)

        Internal: Identity service registers user in Keycloak.'
      requestBody:
        required: true
