  /onboarding-service/api/v1/onboarding/nafath-callback:
    post:
      summary: '[QUALIFIED] 5. Nafath Callback -> QUALIFIED'
      tags:
      - QUALIFIED Stage
      operationId: QUALIFIED__5__Nafath_Callback____QUALIFIED
      description: "PUBLIC WEBHOOK — Nafath callback with accepted=true.\n*** LIFECYCLE TRANSITION: PROSPECT -> QUALIFIED\
        \ ***\nInternal activities auto-triggered:\n  1. Yakeen identity verification (demographics)\n  2. Sanctions/AML screening\n\
        If both pass, customer becomes QUALIFIED."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nationalId:
                  type: string
                  example: '1234567890'
                transactionId:
                  type: string
                  example: nafath-tx-123
                accepted:
                  type: boolean
                  example: true
                rejectionReason:
                  type: string
                  example: None
              required:
              - nationalId
              - transactionId
              - accepted
      responses:
        '200':
