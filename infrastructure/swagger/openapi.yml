      operationId: PROSPECT__4__Initiate_Nafath____PROSPECT
      description: 'JWT REQUIRED — Initiate Nafath identity verification.

        *** LIFECYCLE TRANSITION: LEAD -> PROSPECT ***

        Returns random number for user to select in Nafath app.

        Workflow waits for nafath-callback (30 min timeout).'
      requestBody:
        required: true
