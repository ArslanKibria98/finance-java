  /product-service/api/v1/products/{productId}/settings/approval-workflows:
    put:
      summary: 'Tab 7: Update Approval Workflows'
      tags:
      - Settings (Step 3 — 8 Tabs)
      operationId: Tab_7__Update_Approval_Workflows
      parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workflows:
                  type: array
                  items:
                    type: string
                  example:
                  - workflowType: AUTO_APPROVAL
                    nameEn: Auto Approval - Low Risk
                    nameAr: الموافقة التلقائية - مخاطر منخفضة
                    description: Automatically approve applications with high credit score and adequate salary
                    active: true
                    priority: 1
                    conditions:
                    - field: simah_score
                      operator: GTE
                      value: '700'
                      sortOrder: 1
                    - field: monthly_salary
                      operator: GTE
                      value: '10000'
                      sortOrder: 2
                    - field: financing_amount
                      operator: LTE
                      value: '100000'
                      sortOrder: 3
                    actions:
                    - actionType: APPROVE
                      configuration: '{"notify_customer": true}'
                      sortOrder: 1
                  - workflowType: MANUAL_APPROVAL
                    nameEn: Manual Review - Medium Risk
                    nameAr: المراجعة اليدوية - مخاطر متوسطة
                    description: Route to credit committee for manual review
                    active: true
                    priority: 2
                    conditions:
                    - field: simah_score
                      operator: BETWEEN
                      value: 500-699
                      sortOrder: 1
                    actions:
                    - actionType: ASSIGN_REVIEWER
                      configuration: '{"reviewer_role": "CREDIT_COMMITTEE"}'
                      sortOrder: 1
                    - actionType: NOTIFY
                      configuration: '{"notify_email": "credit@kfs.com"}'
                      sortOrder: 2
                  - workflowType: REJECTION_SCENARIO
                    nameEn: Auto Rejection - High Risk
                    nameAr: الرفض التلقائي - مخاطر عالية
                    description: Auto-reject low credit score or high DBR
                    active: true
                    priority: 3
                    conditions:
                    - field: simah_score
                      operator: LT
                      value: '500'
                      sortOrder: 1
                    actions:
                    - actionType: REJECT
                      configuration: '{"reason_code": "HIGH_RISK"}'
                      sortOrder: 1
              required:
              - workflows
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Bad request — validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized — invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable entity — business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - BearerAuth: []
