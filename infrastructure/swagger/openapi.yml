  /onboarding-service/api/v1/onboarding/submit-info:
    post:
      summary: '[QUALIFIED] 6. Submit Additional Info'
      tags:
      - QUALIFIED Stage
      operationId: QUALIFIED__6__Submit_Additional_Info
      description: "JWT REQUIRED — Submit employment, salary, bank details.\nisPep: true = EDD required, false = normal flow\n\
        lifecycleStage = QUALIFIED\nInternal post-onboarding activities:\n  1. Create Customer CIF (customer-service)\n  2.\
        \ Create Global Profile (global-profile-service)\n  3. Link Regional Profile\n  4. Create SAR Wallet (wallet-service)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nationalId:
                  type: string
                  example: '1234567890'
                email:
                  type: string
                  example: user@example.com
                employerName:
                  type: string
                  example: Saudi Aramco
                employerCrNumber:
                  type: string
                  example: '1234567890'
                employmentType:
                  type: string
                  example: FULL_TIME
                jobTitle:
                  type: string
                  example: Engineer
                basicSalary:
                  type: number
                  example: 15000.0
                grossSalary:
                  type: number
                  example: 18000.0
                netSalary:
                  type: number
                  example: 16500.0
                currency:
                  type: string
                  example: SAR
                bankName:
                  type: string
                  example: Al Rajhi Bank
                bankCode:
                  type: string
                  example: RJHI
                iban:
                  type: string
                  example: SA0380000000608010167519
                accountHolderName:
                  type: string
                  example: Mohammed Al-Saudi
                isPep:
                  type: boolean
                  example: false
              required:
              - nationalId
              - email
              - employerName
              - employerCrNumber
              - employmentType
              - jobTitle
              - basicSalary
              - grossSalary
              - netSalary
              - currency
              - bankName
              - bankCode
              - iban
              - accountHolderName
              - isPep
      responses:
        '200':
          description: Successful operation
