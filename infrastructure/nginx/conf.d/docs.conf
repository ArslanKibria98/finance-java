server {
    listen 80;
    server_name _;

    # Islamic Financing Docs — Docsify SPA
    location /docs/ {
        alias /usr/share/nginx/html/docs/;
        index index.html;
        try_files $uri $uri/ /docs/index.html;
    }

    # Serve markdown files as plain text (required by Docsify)
    location ~* /docs/.*\.md$ {
        root /usr/share/nginx/html;
        add_header Content-Type text/plain;
    }

    # Default root
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ =404;
    }
}
