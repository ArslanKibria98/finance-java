_format_version: "3.0"
_transform: true

# URL pattern: {{kongUrl}}/{service-name}/api/v1/...
# Kong strips the /{service-name} prefix before forwarding to the backend.
# Example: GET http://kong:8000/identity-service/api/v1/auth/policies
#        -> GET http://identity-service:8083/api/v1/auth/policies

services:
  # Identity Service - Registration, OTP, Login, SSO
  - name: identity-service
    url: http://identity-service:8083
    routes:
      - name: identity-routes
        paths:
          - /identity-service
        strip_path: true
        protocols:
          - http
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          policy: local
          fault_tolerant: true
          hide_client_headers: false

  # Customer Service - CIF, Employment, Bank Accounts
  - name: customer-service
    url: http://customer-service:8084
    routes:
      - name: customer-routes
        paths:
          - /customer-service
        strip_path: true
        protocols:
          - http

  # Global Profile Service - Global UID, Regional Profiles
  - name: global-profile-service
    url: http://global-profile-service:8085
    routes:
      - name: profile-routes
        paths:
          - /global-profile-service
        strip_path: true
        protocols:
          - http

  # PII Vault Service - Encrypted PII Storage (internal only via Kong)
  - name: pii-vault-service
    url: http://pii-vault-service:8086
    routes:
      - name: pii-routes
        paths:
          - /pii-vault-service
        strip_path: true
        protocols:
          - http

  # KYC Adapter Service - Nafath, Yakeen, Tahakuk, GOSI, OTP stubs
  - name: kyc-adapter-service
    url: http://kyc-adapter-service:8087
    routes:
      - name: kyc-routes
        paths:
          - /kyc-adapter-service
        strip_path: true
        protocols:
          - http

  # Wallet Service - Balance, Top-up
  - name: wallet-service
    url: http://wallet-service:8088
    routes:
      - name: wallet-routes
        paths:
          - /wallet-service
        strip_path: true
        protocols:
          - http

  # Onboarding Workflow Service - Temporal orchestration
  - name: onboarding-workflow-service
    url: http://onboarding-workflow-service:8089
    routes:
      - name: onboarding-routes
        paths:
          - /onboarding-service
        strip_path: true
        protocols:
          - http

  # Product Service - Islamic financing product catalog management
  - name: product-service
    url: http://product-service:8091
    routes:
      - name: product-routes
        paths:
          - /product-service
        strip_path: true
        protocols:
          - http

  # Fraud Service - Fraud detection, rule engine, alerts and case management
  - name: fraud-service
    url: http://fraud-service:8092
    routes:
      - name: fraud-routes
        paths:
          - /fraud-service
        strip_path: true
        protocols:
          - http

  # Risk Service - AML, Credit Scoring, Sanctions, Internal Checks
  - name: risk-service
    url: http://risk-service:8090
    routes:
      - name: risk-routes
        paths:
          - /risk-service
        strip_path: true
        protocols:
          - http

  # Middleware Third Party - Centralized third-party API management
  - name: middleware-third-party
    url: http://middleware-third-party:8093
    routes:
      - name: middleware-routes
        paths:
          - /middleware-third-party
        strip_path: true
        protocols:
          - http

  # Lending Service - Loan origination, disbursement, repayment
  - name: lending-service
    url: http://lending-service:8097
    routes:
      - name: lending-routes
        paths:
          - /lending-service
        strip_path: true
        protocols:
          - http

  # Collections Service - Payment collections, repayment processing
  - name: collections-service
    url: http://collections-service:8099
    connect_timeout: 120000
    read_timeout: 120000
    write_timeout: 120000
    routes:
      - name: collections-routes
        paths:
          - /collections-service
        strip_path: true
        protocols:
          - http

  # Ledger Service - GL reports, double-entry accounting, Fineract bridge
  - name: ledger-service
    url: http://ledger-service:8095
    routes:
      - name: ledger-routes
        paths:
          - /ledger-service
        strip_path: true
        protocols:
          - http

  # Notification Service - Novu Orchestrator
  - name: notification-service
    url: http://notification-service:8096
    routes:
      - name: notification-routes
        paths:
          - /notification-service
        strip_path: true
        protocols:
          - http

  # Keycloak Authentication
  - name: keycloak-service
    url: http://keycloak:8080
    routes:
      - name: keycloak-routes
        paths:
          - /keycloak
        strip_path: true
        protocols:
          - http

  # Fineract Core Banking
  - name: fineract-service
    url: https://fineract:8443
    routes:
      - name: fineract-routes
        paths:
          - /fineract-service
        strip_path: true
        protocols:
          - http

  # Swagger UI Aggregator - Unified API documentation
  - name: swagger-ui
    url: http://swagger-ui:8080
    routes:
      - name: swagger-routes
        paths:
          - /docs
        strip_path: true
        protocols:
          - http

  # ==========================================================================
  # QA ENVIRONMENT (PM2-managed services on host ports 91XX)
  # Mobile QA build base URL: http://46.62.226.94:8000/qa/<service-name>
  # Kong forwards to host.docker.internal:<qa-port> (host PM2 process).
  # ==========================================================================

  - name: identity-service-qa
    url: http://host.docker.internal:9183
    routes:
      - name: identity-routes-qa
        paths:
          - /qa/identity-service
        strip_path: true
        protocols:
          - http

  - name: customer-service-qa
    url: http://host.docker.internal:9184
    routes:
      - name: customer-routes-qa
        paths:
          - /qa/customer-service
        strip_path: true
        protocols:
          - http

  - name: global-profile-service-qa
    url: http://host.docker.internal:9185
    routes:
      - name: profile-routes-qa
        paths:
          - /qa/global-profile-service
        strip_path: true
        protocols:
          - http

  - name: kyc-adapter-service-qa
    url: http://host.docker.internal:9187
    routes:
      - name: kyc-routes-qa
        paths:
          - /qa/kyc-adapter-service
        strip_path: true
        protocols:
          - http

  - name: wallet-service-qa
    url: http://host.docker.internal:9188
    routes:
      - name: wallet-routes-qa
        paths:
          - /qa/wallet-service
        strip_path: true
        protocols:
          - http

  - name: risk-service-qa
    url: http://host.docker.internal:9190
    routes:
      - name: risk-routes-qa
        paths:
          - /qa/risk-service
        strip_path: true
        protocols:
          - http

  - name: product-service-qa
    url: http://host.docker.internal:9191
    routes:
      - name: product-routes-qa
        paths:
          - /qa/product-service
        strip_path: true
        protocols:
          - http

  - name: fraud-service-qa
    url: http://host.docker.internal:9192
    routes:
      - name: fraud-routes-qa
        paths:
          - /qa/fraud-service
        strip_path: true
        protocols:
          - http

  - name: ledger-service-qa
    url: http://host.docker.internal:9195
    routes:
      - name: ledger-routes-qa
        paths:
          - /qa/ledger-service
        strip_path: true
        protocols:
          - http

  - name: notification-service-qa
    url: http://host.docker.internal:9196
    routes:
      - name: notification-routes-qa
        paths:
          - /qa/notification-service
        strip_path: true
        protocols:
          - http

  - name: lending-service-qa
    url: http://host.docker.internal:9197
    routes:
      - name: lending-routes-qa
        paths:
          - /qa/lending-service
        strip_path: true
        protocols:
          - http

  - name: collections-service-qa
    url: http://host.docker.internal:9199
    routes:
      - name: collections-routes-qa
        paths:
          - /qa/collections-service
        strip_path: true
        protocols:
          - http

  - name: onboarding-workflow-service-qa
    url: http://host.docker.internal:9189
    routes:
      - name: onboarding-routes-qa
        paths:
          - /qa/onboarding-service
        strip_path: true
        protocols:
          - http

plugins:
  # Global CORS - Allow all origins
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - "*"
      exposed_headers:
        - X-Correlation-ID
        - Content-Type
        - Authorization
      credentials: true
      max_age: 3600

  # Global rate limiting
  - name: rate-limiting
    config:
      minute: 100
      policy: local
      fault_tolerant: true
      hide_client_headers: false
