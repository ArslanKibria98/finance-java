###########################################################################
# Logstash pipeline — KSA Islamic Financing
#
# Inputs:
#   - TCP 5000 (json_lines) ← Logback LogstashTcpSocketAppender from services
#
# Routing rules:
#   logger=api-audit + direction=outbound + status=SUCCESS  → api-audit-outbound-{svc}-YYYY.MM.dd
#   logger=api-audit + direction=outbound + status!=SUCCESS → api-audit-thirdparty-YYYY.MM
#   logger=api-audit + status_code >= 400                   → api-audit-errors-YYYY.MM.dd
#   logger=api-audit (else)                                  → api-audit-inbound-{svc}-YYYY.MM.dd
#   level=ERROR                                              → app-logs-errors-{svc}-YYYY.MM.dd
#   default app log                                          → app-logs-{svc}-YYYY.MM.dd
###########################################################################

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  date {
    match => ["@timestamp", "ISO8601"]
    target => "@timestamp"
    timezone => "UTC"
  }

  # Normalize service field: when OpenTelemetry MDC adds "service.name" alongside
  # the flat "service" key, Logstash interprets the dotted key as a nested object,
  # turning [service] into a Hash and breaking the keyword mapping in ES.
  # Collapse it back to a flat string before any downstream filter touches it.
  ruby {
    code => '
      s = event.get("service")
      if s.is_a?(Hash)
        flat = s["name"] || s[:name]
        event.set("service", flat) if flat
      end
    '
  }
  mutate { remove_field => ["[service][name]", "service.name"] }

  # Map Elastic APM agent MDC keys (camelCase: traceId, spanId, transactionId)
  # to ECS nested fields (trace.id, span.id, transaction.id) so that
  # Kibana APM "Logs" tab can correlate a transaction with its application logs.
  # Prefer the camelCase MDC value (auto-injected by APM agent), then fall back
  # to the audit event's snake_case copy (set by ApiAuditFilter).
  ruby {
    code => '
      tid = event.get("traceId") || event.get("trace_id")
      sid = event.get("spanId")  || event.get("span_id")
      txid = event.get("transactionId") || event.get("transaction_id")
      event.set("[trace][id]", tid)        if tid && !tid.to_s.empty?
      event.set("[span][id]",  sid)        if sid && !sid.to_s.empty?
      event.set("[transaction][id]", txid) if txid && !txid.to_s.empty?
    '
  }
  mutate {
    remove_field => ["traceId", "spanId", "transactionId", "trace_id", "span_id", "transaction_id"]
  }

  if ![environment] {
    mutate { add_field => { "environment" => "${LOGSTASH_ENV:local}" } }
  }
  if ![service] {
    mutate { add_field => { "service" => "unknown" } }
  }

  # ---- API AUDIT events ----
  if [logger] == "api-audit" or [logger_name] == "api-audit" or [audit_type] == "api" {
    mutate { add_field => { "[@metadata][stream]" => "api_audit" } }

    if [direction] == "outbound" {
      if [status] == "SUCCESS" {
        mutate { add_field => { "[@metadata][index]" => "api-audit-outbound-%{service}-%{+YYYY.MM.dd}" } }
      } else {
        mutate { add_field => { "[@metadata][index]" => "api-audit-thirdparty-%{+YYYY.MM}" } }
      }
    } else {
      if [status_code] and [status_code] >= 400 {
        mutate { add_field => { "[@metadata][index]" => "api-audit-errors-%{+YYYY.MM.dd}" } }
      } else {
        mutate { add_field => { "[@metadata][index]" => "api-audit-inbound-%{service}-%{+YYYY.MM.dd}" } }
      }
    }

  } else {
    # ---- Regular application log ----
    mutate { add_field => { "[@metadata][stream]" => "app_log" } }

    if [level] == "ERROR" {
      mutate { add_field => { "[@metadata][index]" => "app-logs-errors-%{service}-%{+YYYY.MM.dd}" } }
    } else {
      mutate { add_field => { "[@metadata][index]" => "app-logs-%{service}-%{+YYYY.MM.dd}" } }
    }
  }

  mutate {
    remove_field => ["@version", "host", "port"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:http://elasticsearch:9200}"]
    index => "%{[@metadata][index]}"
  }
  # stdout { codec => rubydebug { metadata => true } }  # debug only
}
