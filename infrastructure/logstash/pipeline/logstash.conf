input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse JSON logs
  json {
    source => "message"
  }

  # Add timestamp if not present
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Parse service name from source
  if [source] {
    grok {
      match => { "source" => "%{DATA:service_name}" }
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "local" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ksa-financing-logs-%{+YYYY.MM.dd}"
  }

  # Optional: Output to stdout for debugging
  stdout {
    codec => rubydebug
  }
}
